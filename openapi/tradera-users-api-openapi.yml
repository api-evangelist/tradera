openapi: 3.2.0
info:
  title: Tradera Users API
  description: REST/JSON version of the Tradera API.
  version: v4-beta
security:
- AppAuth: []
  AppKeyAuth: []
  UserAuth: []
  UserTokenAuth: []
tags:
- name: Users
paths:
  /v4/users/by-alias/{alias}:
    get:
      tags:
      - Users
      summary: Gets a user by their alias
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/User'
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            text/json:
              schema:
                $ref: '#/components/schemas/User'
      operationId: getV4UsersByAliasByAlias
      x-operation-id-source: derived
  /v4/users/{userId}/feedback:
    get:
      tags:
      - Users
      summary: Gets feedback for a user
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/GetFeedbackRole'
      - name: maxNumberOfItems
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetFeedback'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetFeedback'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetFeedback'
      operationId: getV4UsersByUserIdFeedback
      x-operation-id-source: derived
  /v4/users/{userId}/feedback/summary:
    get:
      tags:
      - Users
      summary: Gets a feedback summary for a user
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetFeedbackSummaryResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GetFeedbackSummaryResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GetFeedbackSummaryResponse'
      operationId: getV4UsersByUserIdFeedbackSummary
      x-operation-id-source: derived
  /v4/users/{userId}/seller-info:
    get:
      tags:
      - Users
      summary: Gets seller info for a user. Requires user authentication
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SellerInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/SellerInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/SellerInfo'
      operationId: getV4UsersByUserIdSellerInfo
      x-operation-id-source: derived
  /v4/users/me:
    get:
      tags:
      - Users
      summary: Gets the authenticated user's profile information
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
      operationId: getV4UsersMe
      x-operation-id-source: derived
  /v4/users/me/payment-options:
    get:
      tags:
      - Users
      summary: Gets the authenticated user's payment options
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetMemberPaymentOptionsResult'
            application/json:
              schema:
                $ref: '#/components/schemas/GetMemberPaymentOptionsResult'
            text/json:
              schema:
                $ref: '#/components/schemas/GetMemberPaymentOptionsResult'
      operationId: getV4UsersMePaymentOptions
      x-operation-id-source: derived
components:
  schemas:
    GetMemberPaymentOptionsResult:
      type: object
      properties:
        paymentOptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MemberPaymentOption'
      additionalProperties: false
    SellerInfo:
      type: object
      properties:
        detailedSellerRating:
          $ref: '#/components/schemas/DetailedSellerRating'
        totalRating:
          type: integer
          format: int32
        positiveFeedbackPercent:
          type:
          - integer
          - 'null'
          format: int32
        personalMessage:
          type:
          - string
          - 'null'
        isCompany:
          type: boolean
        hasShop:
          type: boolean
      additionalProperties: false
    FeedbackSummaryItem:
      type: object
      properties:
        totalPositive:
          type: integer
          format: int32
        totalNegative:
          type: integer
          format: int32
      additionalProperties: false
    GetFeedbackSummaryResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int32
        lastMonth:
          $ref: '#/components/schemas/FeedbackSummaryItem'
        lastSixMonth:
          $ref: '#/components/schemas/FeedbackSummaryItem'
        lastTwelveMonth:
          $ref: '#/components/schemas/FeedbackSummaryItem'
      additionalProperties: false
    FeedbackRole:
      enum:
      - 0
      - 1
      type: integer
      format: int32
    MemberPaymentOption:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
      additionalProperties: false
    GetFeedbackRole:
      enum:
      - 0
      - 1
      - 2
      type: integer
      format: int32
    FeedbackRating:
      enum:
      - 0
      - 1
      - 3
      type: integer
      format: int32
    UserInfo:
      type: object
      properties:
        id:
          type: integer
          format: int32
        alias:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        phoneNumber:
          type:
          - string
          - 'null'
        address:
          type:
          - string
          - 'null'
        zipCode:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        countryName:
          type:
          - string
          - 'null'
        personalNumber:
          type:
          - string
          - 'null'
        currencyCode:
          type:
          - string
          - 'null'
        languageCodeIso2:
          type:
          - string
          - 'null'
      additionalProperties: false
    User:
      type: object
      additionalProperties: false
    DetailedSellerRating:
      type: object
      properties:
        itemAsDescribedCount:
          type:
          - integer
          - 'null'
          format: int32
        itemAsDescribedAverage:
          type:
          - number
          - 'null'
          format: double
        commResponsivenessCount:
          type:
          - integer
          - 'null'
          format: int32
        commResponsivenessAverage:
          type:
          - number
          - 'null'
          format: double
        shippingTimeCount:
          type:
          - integer
          - 'null'
          format: int32
        shippingTimeAverage:
          type:
          - number
          - 'null'
          format: double
        shippingHandlingChargesCount:
          type:
          - integer
          - 'null'
          format: int32
        shippingHandlingChargesAverage:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    GetFeedback:
      type: object
      properties:
        feedbackRole:
          $ref: '#/components/schemas/FeedbackRole'
        feedbackRating:
          $ref: '#/components/schemas/FeedbackRating'
        alias:
          type:
          - string
          - 'null'
        comment:
          type:
          - string
          - 'null'
        created:
          type: string
          format: date-time
        totalRating:
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    AppAuth:
      type: apiKey
      description: Application ID
      name: X-App-Id
      in: header
    AppKeyAuth:
      type: apiKey
      description: Application Key
      name: X-App-Key
      in: header
    UserAuth:
      type: apiKey
      description: User ID
      name: X-User-Id
      in: header
    UserTokenAuth:
      type: apiKey
      description: User Token
      name: X-User-Token
      in: header
