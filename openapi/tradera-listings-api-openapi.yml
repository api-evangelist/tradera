openapi: 3.2.0
info:
  title: Tradera Listings API
  description: REST/JSON version of the Tradera API.
  version: v4-beta
security:
- AppAuth: []
  AppKeyAuth: []
  UserAuth: []
  UserTokenAuth: []
tags:
- name: Listings
paths:
  /v4/listings/items/{itemId}:
    get:
      tags:
      - Listings
      summary: Gets a specific item for the authenticated seller, including seller-specific…
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Item'
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
            text/json:
              schema:
                $ref: '#/components/schemas/Item'
      operationId: getV4ListingsItemsByItemId
      x-operation-id-source: derived
    delete:
      tags:
      - Listings
      summary: Ends (deletes) an item listing
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
      operationId: deleteV4ListingsItemsByItemId
      x-operation-id-source: derived
  /v4/listings/seller-items:
    get:
      tags:
      - Listings
      summary: Gets the authenticated seller's items
      parameters:
      - name: categoryId
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: filterActive
        in: query
        schema:
          $ref: '#/components/schemas/ActiveFilter'
      - name: minEndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: maxEndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: filterItemType
        in: query
        schema:
          $ref: '#/components/schemas/ItemTypeFilter'
      - name: maxStartDate
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
      operationId: getV4ListingsSellerItems
      x-operation-id-source: derived
  /v4/listings/updated-seller-items:
    get:
      tags:
      - Listings
      summary: Gets updated seller items since a given row version
      parameters:
      - name: rowVersion
        in: query
        schema:
          type: integer
          format: int64
          default: 0
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpdatedItemInfo'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpdatedItemInfo'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpdatedItemInfo'
      operationId: getV4ListingsUpdatedSellerItems
      x-operation-id-source: derived
  /v4/listings/seller-transactions:
    get:
      tags:
      - Listings
      summary: Gets seller transactions within a date range
      parameters:
      - name: minTransactionDate
        in: query
        schema:
          type: string
          format: date-time
      - name: maxTransactionDate
        in: query
        schema:
          type: string
          format: date-time
      - name: filter
        in: query
        schema:
          $ref: '#/components/schemas/TransactionFilter'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
      operationId: getV4ListingsSellerTransactions
      x-operation-id-source: derived
  /v4/listings/items:
    post:
      tags:
      - Listings
      summary: Adds a new item listing.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
      operationId: postV4ListingsItems
      x-operation-id-source: derived
  /v4/listings/items/xml:
    post:
      tags:
      - Listings
      summary: Adds a new item listing from XML
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemXmlRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AddItemXmlRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AddItemXmlRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
      operationId: postV4ListingsItemsXml
      x-operation-id-source: derived
  /v4/listings/items/{requestId}/images:
    post:
      tags:
      - Listings
      summary: Adds an image to a pending item request
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemImageRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AddItemImageRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AddItemImageRequest'
      responses:
        '200':
          description: OK
      operationId: postV4ListingsItemsByRequestIdImages
      x-operation-id-source: derived
  /v4/listings/items/{requestId}/campaign-code:
    post:
      tags:
      - Listings
      summary: Adds a campaign code to a pending item request
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemCampaignCodeRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AddItemCampaignCodeRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AddItemCampaignCodeRequest'
      responses:
        '200':
          description: OK
      operationId: postV4ListingsItemsByRequestIdCampaignCode
      x-operation-id-source: derived
  /v4/listings/items/{requestId}/commit:
    post:
      tags:
      - Listings
      summary: Commits a pending item request, finalizing the listing
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
      operationId: postV4ListingsItemsByRequestIdCommit
      x-operation-id-source: derived
  /v4/listings/items/{itemId}/restart:
    post:
      tags:
      - Listings
      summary: Restarts an ended item, listing it again as a new item.
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RestartItemResult'
            application/json:
              schema:
                $ref: '#/components/schemas/RestartItemResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestartItemResult'
      operationId: postV4ListingsItemsByItemIdRestart
      x-operation-id-source: derived
  /v4/listings/items/prices:
    put:
      tags:
      - Listings
      summary: Sets prices on an auction.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPricesNonShopItem'
          text/json:
            schema:
              $ref: '#/components/schemas/SetPricesNonShopItem'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SetPricesNonShopItem'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SetPricesOnNonShopItemsResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SetPricesOnNonShopItemsResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SetPricesOnNonShopItemsResult'
      operationId: putV4ListingsItemsPrices
      x-operation-id-source: derived
  /v4/listings/items/{itemId}/price:
    put:
      tags:
      - Listings
      summary: 'Updates the price of a non-shop item without changing its item type: an auction…'
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemPriceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateItemPriceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateItemPriceRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UpdateItemPriceResult'
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateItemPriceResult'
            text/json:
              schema:
                $ref: '#/components/schemas/UpdateItemPriceResult'
      operationId: putV4ListingsItemsByItemIdPrice
      x-operation-id-source: derived
  /v4/listings/shop-items:
    post:
      tags:
      - Listings
      summary: Adds a new shop item
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopItemData'
          text/json:
            schema:
              $ref: '#/components/schemas/ShopItemData'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ShopItemData'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
      operationId: postV4ListingsShopItems
      x-operation-id-source: derived
    put:
      tags:
      - Listings
      summary: Updates an existing shop item
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopItemUpdateData'
          text/json:
            schema:
              $ref: '#/components/schemas/ShopItemUpdateData'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ShopItemUpdateData'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
      operationId: putV4ListingsShopItems
      x-operation-id-source: derived
  /v4/listings/shop-items/variant:
    post:
      tags:
      - Listings
      summary: Adds a new shop item variant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopItemVariantData'
          text/json:
            schema:
              $ref: '#/components/schemas/ShopItemVariantData'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ShopItemVariantData'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
      operationId: postV4ListingsShopItemsVariant
      x-operation-id-source: derived
    put:
      tags:
      - Listings
      summary: Updates an existing shop item variant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopItemVariantUpdateData'
          text/json:
            schema:
              $ref: '#/components/schemas/ShopItemVariantUpdateData'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ShopItemVariantUpdateData'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
      operationId: putV4ListingsShopItemsVariant
      x-operation-id-source: derived
  /v4/listings/shop-items/{itemId}:
    delete:
      tags:
      - Listings
      summary: Removes a shop item
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/QueuedRequestResponse'
      operationId: deleteV4ListingsShopItemsByItemId
      x-operation-id-source: derived
  /v4/listings/shop-items/prices:
    put:
      tags:
      - Listings
      summary: Sets prices on shop items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPriceOnShopItemsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SetPriceOnShopItemsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SetPriceOnShopItemsRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SetPriceOnShopItemsResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SetPriceOnShopItemsResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SetPriceOnShopItemsResult'
      operationId: putV4ListingsShopItemsPrices
      x-operation-id-source: derived
  /v4/listings/shop-items/quantities:
    put:
      tags:
      - Listings
      summary: Sets quantities on shop items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetQuantityOnShopItemsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SetQuantityOnShopItemsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SetQuantityOnShopItemsRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SetQuantityOnShopItemsResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SetQuantityOnShopItemsResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SetQuantityOnShopItemsResult'
      operationId: putV4ListingsShopItemsQuantities
      x-operation-id-source: derived
  /v4/listings/shop-items/activate-dates:
    put:
      tags:
      - Listings
      summary: Sets activate dates on shop items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActivateDateOnShopItemsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SetActivateDateOnShopItemsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SetActivateDateOnShopItemsRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SetActivateDateOnShopItemsResult'
            application/json:
              schema:
                $ref: '#/components/schemas/SetActivateDateOnShopItemsResult'
            text/json:
              schema:
                $ref: '#/components/schemas/SetActivateDateOnShopItemsResult'
      operationId: putV4ListingsShopItemsActivateDates
      x-operation-id-source: derived
  /v4/listings/request-results:
    get:
      tags:
      - Listings
      summary: Gets results for previously queued requests
      parameters:
      - name: requestIds
        in: query
        schema:
          type: array
          items:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestResult'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestResult'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestResult'
      operationId: getV4ListingsRequestResults
      x-operation-id-source: derived
  /v4/listings/shop-settings:
    get:
      tags:
      - Listings
      summary: Gets the authenticated seller's shop settings
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ShopSettingsData'
            application/json:
              schema:
                $ref: '#/components/schemas/ShopSettingsData'
            text/json:
              schema:
                $ref: '#/components/schemas/ShopSettingsData'
      operationId: getV4ListingsShopSettings
      x-operation-id-source: derived
    put:
      tags:
      - Listings
      summary: Updates the authenticated seller's shop settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopSettingsData'
          text/json:
            schema:
              $ref: '#/components/schemas/ShopSettingsData'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ShopSettingsData'
      responses:
        '200':
          description: OK
      operationId: putV4ListingsShopSettings
      x-operation-id-source: derived
  /v4/listings/feedback/transaction/{transactionId}:
    post:
      tags:
      - Listings
      summary: Leaves feedback for a transaction
      parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveFeedbackRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/LeaveFeedbackRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LeaveFeedbackRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
      operationId: postV4ListingsFeedbackTransactionByTransactionId
      x-operation-id-source: derived
  /v4/listings/feedback/order/{orderNumber}:
    post:
      tags:
      - Listings
      summary: Leaves order feedback to buyer
      parameters:
      - name: orderNumber
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveFeedbackRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/LeaveFeedbackRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LeaveFeedbackRequest'
      responses:
        '200':
          description: OK
      operationId: postV4ListingsFeedbackOrderByOrderNumber
      x-operation-id-source: derived
  /v4/listings/validate-campaign-code:
    post:
      tags:
      - Listings
      summary: Validates a campaign code for a category
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCampaignCodeRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ValidateCampaignCodeRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ValidateCampaignCodeRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ValidateCampaignCodeResult'
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCampaignCodeResult'
            text/json:
              schema:
                $ref: '#/components/schemas/ValidateCampaignCodeResult'
      operationId: postV4ListingsValidateCampaignCode
      x-operation-id-source: derived
  /v4/listings/transaction-status:
    put:
      tags:
      - Listings
      summary: Updates the status of a transaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionStatusUpdateData'
          text/json:
            schema:
              $ref: '#/components/schemas/TransactionStatusUpdateData'
          application/*+json:
            schema:
              $ref: '#/components/schemas/TransactionStatusUpdateData'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Transaction'
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
            text/json:
              schema:
                $ref: '#/components/schemas/Transaction'
      operationId: putV4ListingsTransactionStatus
      x-operation-id-source: derived
components:
  schemas:
    SetPricesNonShopItem:
      type: object
      properties:
        id:
          type: integer
          format: int32
        openingPrice:
          type: integer
          format: int32
        reservedPrice:
          $ref: '#/components/schemas/ReservedPrice'
        binPrice:
          $ref: '#/components/schemas/BinPrice'
      additionalProperties: false
    AddItemImageRequest:
      type: object
      properties:
        imageData:
          type:
          - string
          - 'null'
          description: The image data as a byte array.
          format: byte
        imageFormat:
          $ref: '#/components/schemas/ImageFormat'
        hasMega:
          type: boolean
          description: Whether the image has a mega (high-resolution) version.
      additionalProperties: false
      description: Request body for AddItemImage endpoint.
    ReservedPrice:
      type: object
      properties:
        price:
          type: integer
          format: int32
      additionalProperties: false
    TransactionFilter:
      enum:
      - 2
      - 4
      type: integer
      format: int32
    AddItemCampaignCodeRequest:
      type: object
      properties:
        campaignCode:
          type:
          - string
          - 'null'
          description: The campaign code.
      additionalProperties: false
      description: Request body for AddItemCampaignCode endpoint.
    ApiItemType:
      enum:
      - 1
      - 3
      - 4
      - 5
      type: integer
      format: int32
    ValidateCampaignCodeRequest:
      type: object
      properties:
        campaignCode:
          type:
          - string
          - 'null'
          description: The campaign code to validate.
        categoryId:
          type: integer
          description: The category ID to validate against.
          format: int32
      additionalProperties: false
      description: Request body for ValidateCampaignCode endpoint.
    ImageLink:
      type: object
      properties:
        url:
          type:
          - string
          - 'null'
        format:
          type:
          - string
          - 'null'
      additionalProperties: false
    ItemRequest:
      type: object
      properties:
        title:
          type:
          - string
          - 'null'
        ownReferences:
          type:
          - array
          - 'null'
          items:
            type: string
        categoryId:
          type: integer
          format: int32
        duration:
          type: integer
          format: int32
        restarts:
          type: integer
          format: int32
        startPrice:
          type: integer
          format: int32
        reservePrice:
          type: integer
          format: int32
        buyItNowPrice:
