openapi: 3.2.0
info:
  title: Tradera Items API
  description: REST/JSON version of the Tradera API.
  version: v4-beta
security:
- AppAuth: []
  AppKeyAuth: []
  UserAuth: []
  UserTokenAuth: []
tags:
- name: Items
paths:
  /v4/items/{itemId}:
    get:
      tags:
      - Items
      summary: Gets a single item by ID
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Item'
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
            text/json:
              schema:
                $ref: '#/components/schemas/Item'
      operationId: getV4ItemsByItemId
      x-operation-id-source: derived
  /v4/items/{itemId}/descriptions:
    get:
      tags:
      - Items
      summary: Gets added descriptions for an item
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemAddedDescription'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemAddedDescription'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemAddedDescription'
      operationId: getV4ItemsByItemIdDescriptions
      x-operation-id-source: derived
  /v4/items/{itemId}/restarts:
    get:
      tags:
      - Items
      summary: Gets item restart history
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ItemRestarts'
            application/json:
              schema:
                $ref: '#/components/schemas/ItemRestarts'
            text/json:
              schema:
                $ref: '#/components/schemas/ItemRestarts'
      operationId: getV4ItemsByItemIdRestarts
      x-operation-id-source: derived
  /v4/items/seller/{userId}:
    get:
      tags:
      - Items
      summary: Gets items listed by a specific seller
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: categoryId
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: filterActive
        in: query
        schema:
          $ref: '#/components/schemas/ActiveFilter'
      - name: minEndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: maxEndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: filterItemType
        in: query
        schema:
          $ref: '#/components/schemas/ItemTypeFilter'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
      operationId: getV4ItemsSellerByUserId
      x-operation-id-source: derived
  /v4/items/seller/{userId}/quick-info:
    get:
      tags:
      - Items
      summary: Gets quick info for items listed by a specific seller
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: categoryId
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: filterActive
        in: query
        schema:
          $ref: '#/components/schemas/ActiveFilter'
      - name: filterItemType
        in: query
        schema:
          $ref: '#/components/schemas/ItemTypeFilter'
      - name: minEndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: maxEndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: minCreatedDate
        in: query
        schema:
          type: string
          format: date-time
      - name: maxCreatedDate
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemQuickInfo'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemQuickInfo'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemQuickInfo'
      operationId: getV4ItemsSellerByUserIdQuickInfo
      x-operation-id-source: derived
components:
  schemas:
    ItemShipping:
      type: object
      properties:
        shippingOptionId:
          type:
          - integer
          - 'null'
          description: 'OBSOLETE: Use Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.ShippingProviderId instead. Takes the same numeric ids.'
          format: int32
        cost:
          type: integer
          format: int32
        shippingWeight:
          type:
          - number
          - 'null'
          format: double
        shippingWeightSpecified:
          type: boolean
        shippingProductId:
          type:
          - integer
          - 'null'
          format: int32
        shippingProductIdSpecified:
          type: boolean
        shippingProviderId:
          type:
          - integer
          - 'null'
          description: "The numeric id of the shipping provider. Call GetShippingOptions (SOAP) or\nGET /v4/reference-data/shipping-options (REST) for the providers a seller can use — every\nproduct returned carries the ShippingProviderId to send back. The set changes over time,\nso read it from the API rather than hard-coding it.\n            \nDEPRECATED providers, rejected when listing an item: Posten (1), Bussgods (3), UPS (4),\nFedEx (5), NotSpecified (10) and PostNordStampDenmark (15). Sellers who used Posten should\nuse PostNordParcel (12) or Alternative (6) instead."
          format: int32
        sellerSurcharge:
          type:
          - integer
          - 'null'
          description: 'Optional seller-defined surcharge added on top of the shipping product''s base cost.

            Not yet used to compute the buyer-facing shipping price — Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.Cost is still

            the authoritative, required field today and must be sent. In a future API revision,

            Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.Cost will be removed and the buyer-facing price will be derived from

            the shipping product (identified by Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.ShippingProductId) adjusted by

            Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.SellerSurcharge and Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.SellerDiscount.'
          format: int32
        sellerSurchargeSpecified:
          type: boolean
        sellerDiscount:
          type:
          - integer
          - 'null'
          description: 'Optional seller-defined discount subtracted from the shipping product''s base cost.

            Not yet used to compute the buyer-facing shipping price — Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.Cost is still

            the authoritative, required field today and must be sent. In a future API revision,

            Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.Cost will be removed and the buyer-facing price will be derived from

            the shipping product (identified by Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.ShippingProductId) adjusted by

            Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.SellerSurcharge and Tradera.Api.Services.Core.Contracts.Entities.ItemShipping.SellerDiscount.'
          format: int32
        sellerDiscountSpecified:
          type: boolean
      additionalProperties: false
    ItemQuickInfo:
      type: object
      properties:
        creationDate:
          type: string
          format: date-time
        itemType:
          $ref: '#/components/schemas/ApiItemType'
        id:
          type: integer
          format: int32
      additionalProperties: false
    ActiveFilter:
      enum:
      - 0
      - 1
      - 2
      type: integer
      format: int32
    ApiItemType:
      enum:
      - 1
      - 3
      - 4
      - 5
      type: integer
      format: int32
    Item:
      type: object
      properties:
        shippingOptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ItemShipping'
        paymentOptions:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        imageLinks:
          type:
          - array
          - 'null'
          items:
            type: string
        buyerList:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/User'
        status:
          $ref: '#/components/schemas/ItemStatus'
        startQuantity:
          type: integer
          format: int32
        remainingQuantity:
          type: integer
          format: int32
        itemType:
          $ref: '#/components/schemas/ApiItemType'
        detailedImageLinks:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImageLink'
        id:
          type: integer
          format: int32
        vat:
          type: integer
          format: int32
        vatSpecified:
          type: boolean
        shortDescription:
          type:
          - string
          - 'null'
        ownReferences:
          type:
          - array
          - 'null'
          items:
            type: string
        attributeValues:
          $ref: '#/components/schemas/AttributeValues'
        itemAttributes:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        longDescription:
          type:
          - string
          - 'null'
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        categoryId:
          type: integer
          format: int32
        openingBid:
          type: integer
          format: int32
        openingBidSpecified:
          type: boolean
        reservePrice:
          type: integer
          format: int32
        reservePriceSpecified:
          type: boolean
        reservePriceReached:
          type:
          - boolean
          - 'null'
        buyItNowPrice:
          type: integer
          format: int32
        buyItNowPriceSpecified:
          type: boolean
        nextBid:
          type: integer
          format: int32
        nextBidSpecified:
          type: boolean
        paymentCondition:
          type:
          - string
          - 'null'
        shippingCondition:
          type:
          - string
          - 'null'
        acceptsPickup:
          type: boolean
        totalBids:
          type: integer
          format: int32
        maxBid:
          type: integer
          format: int32
        maxBidSpecified:
          type: boolean
        statusId:
          type: integer
          format: int32
        bold:
          type: boolean
        thumbnail:
          type: boolean
        highlight:
          type: boolean
        featuredItem:
          type: boolean
        itemLink:
          type:
          - string
          - 'null'
        thumbnailLink:
          type:
          - string
          - 'null'
        acceptedBuyerId:
          type: integer
          format: int32
        paypal:
          type: boolean
        paymentTypeId:
          type: integer
          format: int32
        seller:
          $ref: '#/components/schemas/User'
        maxBidder:
          $ref: '#/components/schemas/User'
        userSelectedEndDate:
          type: boolean
        restarts:
          type: integer
          format: int32
        duration:
          type: integer
          format: int32
        reservePriceManuallySet:
          type: boolean
      additionalProperties: false
      description: 'Property order must match the old ASP.NET service''s serialization order exactly.

        The old XmlSerializer serializes public fields before properties, so the former

        fields (ShippingOptions through DetailedImageLinks) must come first.'
    RestartedItem:
      type: object
      properties:
        restartedItemId:
          type: integer
          format: int32
        restartedAsItemId:
          type: integer
          format: int32
        restartedDate:
          type: string
          format: date-time
      additionalProperties: false
    ImageLink:
      type: object
      properties:
        url:
          type:
          - string
          - 'null'
        format:
          type:
          - string
          - 'null'
      additionalProperties: false
    TermAttributeValue:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        values:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    NumberAttributeValue:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        values:
          type:
          - array
          - 'null'
          items:
            type: number
            format: double
      additionalProperties: false
    AttributeValues:
      type: object
      properties:
        termAttributeValues:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TermAttributeValue'
        numberAttributeValues:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/NumberAttributeValue'
      additionalProperties: false
    ItemTypeFilter:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      format: int32
    User:
      type: object
      additionalProperties: false
    ItemStatus:
      type: object
      additionalProperties: false
    ItemAddedDescription:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        createdDate:
          type: string
          format: date-time
      additionalProperties: false
    ItemRestarts:
      type: object
      properties:
        lastRestartedItemId:
          type: integer
          format: int32
        ancestorItemId:
          type: integer
          format: int32
        restartedItems:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RestartedItem'
      additionalProperties: false
  securitySchemes:
    AppAuth:
      type: apiKey
      description: Application ID
      name: X-App-Id
      in: header
    AppKeyAuth:
      type: apiKey
      description: Application Key
      name: X-App-Key
      in: header
    UserAuth:
      type: apiKey
      description: User ID
      name: X-User-Id
      in: header
    UserTokenAuth:
      type: apiKey
      description: User Token
      name: X-User-Token
      in: header
